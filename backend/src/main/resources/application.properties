spring.application.name=ProductosPrueba

# ============================================================
# Database - Neon PostgreSQL
# Override via env vars: DB_URL, DB_USER, DB_PASS
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-lively-flower-acknkoey-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASS:npg_cb6qOpKwG3Ui}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# Override JPA_SHOW_SQL=false in production
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=${DEFER_INIT:false}
spring.sql.init.mode=${SQL_INIT_MODE:never}

# ============================================================
# Server
# ============================================================
server.port=${PORT:8081}

# ============================================================
# Security
# ============================================================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ============================================================
# Cloudinary (set env vars in production: CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET)
# ============================================================
CLOUDINARY_CLOUD_NAME=placeholder
CLOUDINARY_API_KEY=placeholder
CLOUDINARY_API_SECRET=placeholder
