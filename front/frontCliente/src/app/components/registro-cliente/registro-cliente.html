<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, initial-scale=1">

<div class="main-container">
  <div class="card">
    <!-- Título dinámico -->
    <h2>{{ isLogin ? 'Iniciar Sesión' : 'Registro de Nuevo Cliente' }}</h2>

    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">

      <!-- GRUPO 1: SOLO REGISTRO (Nombre y Apellido) -->
      <div *ngIf="!isLogin">
        <div class="row">
          <div class="field">
            <label>Nombre *</label>
            <input type="text" formControlName="nombre">
          </div>
          <div class="field">
            <label>Apellido *</label>
            <input type="text" formControlName="apellido">
          </div>
        </div>
      </div>

      <!-- GRUPO 2: SIEMPRE VISIBLE (Email y Contraseña) -->
      <div class="row">
        <div class="field">
          <label>Email *</label>
          <input type="email" formControlName="email">
        </div>
        <div class="field">
          <label>Contraseña *</label>
          <input type="contraseña" formControlName="contraseña">
        </div>
      </div>

      <!-- GRUPO 3: SOLO REGISTRO (Dirección Completa) -->
      <div *ngIf="!isLogin">
        <div class="row">
          <div class="field">
            <label>País *</label>
            <input type="text" formControlName="pais">
          </div>
          <div class="field">
            <label>Provincia *</label>
            <input type="text" formControlName="provincia">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Localidad *</label>
            <input type="text" formControlName="localidad">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Calle *</label>
            <input type="text" formControlName="calle">
          </div>
          <div class="field">
            <label>Número *</label>
            <input type="text" formControlName="altura">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Piso (Opcional)</label>
            <input type="text" formControlName="piso">
          </div>
          <div class="field">
            <label>Departamento (Opcional)</label>
            <input type="text" formControlName="departamento">
          </div>
        </div>
      </div>

      <!-- Mensaje de éxito (solo para registro) -->
      <div *ngIf="registrado && !isLogin" class="mensaje-exito">
        Registro completado correctamente
      </div>

      <!-- Botón dinámico -->
      <button type="submit" [disabled]="!isLogin && registroForm.invalid">
        {{ isLogin ? 'Ingresar' : 'Finalizar Registro' }}
      </button>

    </form>

    <!-- Selector para cambiar entre Login y Registro -->
    <div class="toggle-container" style="text-align: center; margin-top: 15px;">
      <p (click)="cambiarModo()" style="cursor: pointer; color: #007bff; text-decoration: underline;">
        {{ isLogin ? '¿No tienes cuenta? Regístrate aquí' : '¿Ya tienes cuenta? Inicia sesión' }}
      </p>
    </div>

  </div>
</div>
